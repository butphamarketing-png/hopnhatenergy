<!DOCTYPE html>
<html lang="vi" data-theme="led" data-solar-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Danh mục đèn LED — phân cấp theo danh mục sản phẩm." />
  <title>Sản phẩm | Đèn LED | Hợp Nhất Energy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="../../js/themes/led.js"></script>
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/products-pages.css" />
  <link rel="stylesheet" href="../../css/cart.css" />
  <link rel="stylesheet" href="../../css/led.css" />
</head>
<body>
  <header class="pp-header">
    <a href="../" class="pp-back">← Trang chủ</a>
    <p class="pp-brand">Solar <span>Miền Nam</span></p>
    <div class="pp-header__cart" data-cart-mount="light"></div>
  </header>

  <main class="pp-wrap pp-wrap--catalog">
    <p class="pp-label">Sản phẩm</p>
    <h1 class="pp-title">Danh mục đèn LED</h1>
    <p class="pp-desc">Chọn danh mục bên trái để xem sản phẩm theo từng nhóm.</p>

    <div class="pp-layout">
      <aside class="pp-tree" aria-label="Danh mục sản phẩm">
        <p class="pp-tree__title">Danh mục</p>
        <nav id="pp-tree" class="pp-tree__nav"></nav>
      </aside>

      <div class="pp-main">
        <div class="pp-toolbar">
          <input type="search" id="pp-search" class="pp-search" placeholder="Tìm sản phẩm..." aria-label="Tìm kiếm" />
          <select id="pp-filter" class="pp-filter" aria-label="Lọc thương hiệu" hidden>
            <option value="">Tất cả thương hiệu</option>
          </select>
        </div>
        <p class="pp-cat-heading" id="pp-cat-heading">Tất cả sản phẩm</p>
        <ul class="pp-grid" id="pp-grid"></ul>
        <nav class="pp-pager" id="pp-pager" aria-label="Phân trang"></nav>
      </div>
    </div>
  </main>

  <script src="../../js/cart.js"></script>
  <script src="../../js/product-pages.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.SolarCart && window.SolarCart.init();
      window.SolarProductPages && window.SolarProductPages.mountCatalog();
    });
  </script>
</body>
</html>
