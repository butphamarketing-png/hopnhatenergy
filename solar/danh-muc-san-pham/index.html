<!DOCTYPE html>
<html lang="vi" data-theme="solar" data-solar-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Danh mục sản phẩm điện mặt trời chính hãng — Solar Miền Nam." />
  <title>Danh mục sản phẩm | Solar Miền Nam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="../../js/themes/solar.js"></script>
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/products-pages.css" />
  <link rel="stylesheet" href="../../css/cart.css" />
</head>
<body>
  <header class="pp-header">
    <a href="../" class="pp-back">← Trang chủ</a>
    <p class="pp-brand">Solar <span>Miền Nam</span></p>
    <div class="pp-header__cart" data-cart-mount="light"></div>
  </header>

  <main class="pp-wrap">
    <p class="pp-label">Sản phẩm</p>
    <h1 class="pp-title">Danh mục sản phẩm</h1>
    <p class="pp-desc">Thiết bị điện mặt trời chính hãng từ các thương hiệu hàng đầu thế giới.</p>

    <div class="pp-toolbar">
      <input type="search" id="pp-search" class="pp-search" placeholder="Tìm sản phẩm..." aria-label="Tìm kiếm" />
      <select id="pp-filter" class="pp-filter" aria-label="Lọc danh mục">
        <option value="">Tất cả danh mục</option>
      </select>
    </div>

    <ul class="pp-grid" id="pp-grid"></ul>
    <nav class="pp-pager" id="pp-pager" aria-label="Phân trang"></nav>
  </main>

  <script src="../../js/cart.js"></script>
  <script src="../../js/product-pages.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.SolarCart && window.SolarCart.init();
      window.SolarProductPages && window.SolarProductPages.mountCatalog();
    });
  </script>
</body>
</html>
